<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

//** This is the page where user can select their role before login or registration. Based on the selection the user will be redirected to the login page and then to the respective pages based on their role.
<body>
    <button onclick="userRole('admin')">Admin</button> </hr>
    <button onclick="userRole('user')">User</button>
</body>
<script>
    function userRole(role){
        console.log(role);
        localStorage.setItem("role",role)
        window.location.href="loginform.html"
    }
</script>
</html>
