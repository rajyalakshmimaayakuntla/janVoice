<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
//** This is the page where admin can see all the issues raised by the users. The admin can also update the status of the issue and also delete the issue if they want to.
<style>
    #cont{
        display: flex;
        flex-wrap:wrap ;
    }
</style>
<body>
    <h1 id="msg"></h1>
    <input type="radio" name="filter" value="all" checked>All Issues
    <input type="radio" name="filter" value="Pending">Pending Issues
    <input type="radio" name="filter" value="Assigned">Assigned Issues
    <input type="radio" name="filter" value="Resolved">Resolved Issues
    <div id="cont"></div>
    <div id="cont2"></div>
    
    <script>
        const user=JSON.parse(localStorage.getItem("user"))
        document.getElementById("msg").innerText="Hi , "+user.username
        fetch("http://localhost:3000/getAllIssues")
        .then((res)=>res.json())
        .then((data)=>{
            genUI(data)
        })
        function genUI(data){
            document.getElementById("cont").innerHTML=""
            document.getElementById("cont2").innerHTML=""
            data.forEach((issue,i)=>{
                const card=document.createElement("div")
                card.style.border = "1px solid black"
                card.style.margin = "10px"
                card.style.padding = "10px"
                card.style.width = "250px"
                card.style.textAlign="center"  

                const issue_name=document.createElement("p")
                issue_name.innerHTML=" <b> <u>Issue Name</u> : </b>"+issue.issue_name

                const issue_image=document.createElement("img")
                issue_image.src="/"+issue.issue_image
                issue_image.style.width="230px"

                const issue_status=document.createElement("p")
                issue_status.innerHTML="<b><u>Issue Status</u> : </b>"+ issue.issue_status

                const btn=document.createElement("button")
                btn.innerHTML="Explore Issue"
                btn.onclick=(ev)=>{
                    ev.preventDefault()
                //    alert(JSON.stringify(issue))
                   fetch("/exploreIssue",{
                    method:"POST",
                    headers:{"Content-Type":"application/json"},
                    body:JSON.stringify({userId:issue.userId})
                   }).then((res)=>res.json())
                   .then((data)=>{
                    // console.log(data);
                    document.getElementById("cont2").innerHTML=""
                    const expandcard=document.createElement("div")

                    expandcard.style.border = "1px solid black"
                    expandcard.style.margin = "15px"
                    expandcard.style.padding = "15px"
                    expandcard.style.width = "600px"
                    expandcard.style.textAlign="center" 

                      const issue_name=document.createElement("p")
                      issue_name.innerHTML=" <b> <u>Issue Name</u> : </b>"+issue.issue_name

                      const issue_image=document.createElement("img")
                      issue_image.src="/"+issue.issue_image

                      const issue_status=document.createElement("p")
                      issue_status.innerHTML="<b><u>Issue Status</u> : </b>"+ issue.issue_status

                      const issue_address=document.createElement("p")
                      issue_address.innerHTML="<b><u>Issue Address</u> : </b>"+issue.issue_address

                      const head=document.createElement("h4")
                      head.innerHTML="<u>Issue Raised by</u>"

                      const username=document.createElement("p")
                      username.innerHTML="<b><u>User Name</u> : </b>"+data[0].username

                      const user_email=document.createElement("p")
                      user_email.innerHTML="<b><u>user Email</u> : </b>"+data[0].email

                      const user_phoneno=document.createElement("p")
                      user_phoneno.innerHTML="<b><u>User Phoneno.</u> : </b>"+data[0].phoneno

                      const update=document.createElement("button")
                      if(issue.issue_status==="Pending"){
                        update.innerText="Assign"
                      }
                      else if(issue.issue_status==="Assigned"){
                        update.innerText="Mark as Resolved"
                      }
                      else if(issue.issue_status==="Resolved"){
                        update.innerText="Completed"
                        update.disabled=true
                      }

                      const del=document.createElement("button")
                      del.innerText="Delete"
                      del.onclick=()=>{
                        fetch("/deleteIssue",{
                            method:"POST",
                            headers:{"Content-Type":"application/json"},
                            body:JSON.stringify({issueId:issue._id})
                        }).then((res)=>res.json())
                        .then((data)=>{
                            alert(data.msg)

                            fetch("http://localhost:3000/getAllIssues")
                            .then((res)=>res.json())
                            .then((data)=>{
                            genUI(data)
                             })
                        })
                      }

                      update.onclick=(ev)=>{
                        ev.preventDefault()
                        // console.log(JSON.stringify(issue._id));
                        fetch("/updateIssue",{
                            method:"POST",
                            headers:{"Content-Type":"application/json"},
                            body:JSON.stringify({issueId:issue._id})
                        }).then((res)=>res.json())
                        .then((data)=>{
                            // alert(data.msg);
                            if(data.msg==="issue Assigned"){
                                issue.issue_status="Assigned"
                                update.innerText="Mark as Resolved"
                                issue_status.innerHTML="<b><u>Issue Status</u> : </b>Assigned"
                            }
                            else if(data.msg==="issue Resolved"){
                                issue.issue_status="Resolved"
                                update.innerText="completed"
                                update.disabled=true
                                issue_status.innerHTML="<b><u>Issue Status</u> : </b>Resolved"
                            }
                        })
                      }
     
                      expandcard.appendChild(issue_name)
                      expandcard.appendChild(issue_image)
                      expandcard.appendChild(issue_status)
                      expandcard.appendChild(issue_address)
                      expandcard.appendChild(head)
                      expandcard.appendChild(username)
                      expandcard.appendChild(user_email)
                      expandcard.appendChild(user_phoneno)
                      expandcard.appendChild(update)
                      expandcard.appendChild(del)

                      document.getElementById("cont2").appendChild(expandcard)

                   })
                }

                card.appendChild(issue_name)
                card.appendChild(issue_image)
                card.appendChild(issue_status)
                card.appendChild(btn)

                document.getElementById("cont").appendChild(card)

            })
        }
        document.querySelectorAll('input[name="filter"]').forEach(radio=>{
        radio.onchange = ()=>{
        const selected = document.querySelector('input[name="filter"]:checked').value
        // console.log(selected)
        fetch("/getIssuesByStatus",{
            method:"POST",
            headers:{"Content-Type":"application/json"},
            body:JSON.stringify({issue_status:selected})
        }).then((res)=>res.json())
          .then((data)=>{
           genUI(data)
        })
    }
})
    </script>
</body>
</html>
