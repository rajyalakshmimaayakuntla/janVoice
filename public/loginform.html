<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:"Poppins",sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#6366f1,#3b82f6);
}

/* Card */
.container{
    background:white;
    padding:35px;
    border-radius:15px;
    width:330px;
    text-align:center;
    box-shadow:0 15px 40px rgba(0,0,0,0.2);
}

/* Title */
.container h2{
    margin-bottom:10px;
    color:#1e293b;
}

/* Role */
.role{
    font-size:13px;
    color:#64748b;
    margin-bottom:15px;
}

/* Inputs */
.input-group{
    position:relative;
}

input{
    width:100%;
    padding:10px;
    margin:10px 0;
    border-radius:8px;
    border:1px solid #ddd;
    outline:none;
}

input:focus{
    border-color:#6366f1;
}

/* Eye */
.eye{
    position:absolute;
    right:10px;
    top:50%;
    transform:translateY(-50%);
    cursor:pointer;
}

/* Button */
button{
    width:100%;
    padding:10px;
    margin-top:10px;
    border:none;
    border-radius:8px;
    background:#6366f1;
    color:white;
    font-size:16px;
    cursor:pointer;
}

button:hover{
    background:#4f46e5;
}

button:disabled{
    background:gray;
    cursor:not-allowed;
}

/* Link */
a{
    display:block;
    margin-top:15px;
    color:#6366f1;
    text-decoration:none;
}

/* Message */
#msg{
    margin-top:10px;
    font-size:14px;
}
</style>
</head>

<body>

<div class="container">

    <h2>Welcome Back 👋</h2>

    <div class="role">
        Role: <b id="roleText"></b>
    </div>

    <form id="form">

        <input type="text" placeholder="Username" id="un">

        <div class="input-group">
            <input type="password" placeholder="Password" id="ps">
            <span class="eye" onclick="togglePassword()">👁️</span>
        </div>

        <button id="loginBtn" onclick="login(event)">
            Login
        </button>

    </form>

    <a href="registrationform.html">
        Create Account
    </a>

    <p id="msg"></p>

</div>

<script>

const role = localStorage.getItem("role") || "user"

document.getElementById("roleText").innerText = role.toUpperCase()

/* Show / Hide Password */
function togglePassword(){

    const ps = document.getElementById("ps")

    if(ps.type === "password"){
        ps.type = "text"
    }
    else{
        ps.type = "password"
    }
}

/* Login */
function login(ev){

    ev.preventDefault()

    const btn = document.getElementById("loginBtn")
    const msg = document.getElementById("msg")

    btn.innerText = "Logging in..."
    btn.disabled = true

    const login_details = {

        username: document.getElementById("un").value,
        password: document.getElementById("ps").value,
        role: role
    }

    fetch("/login",{

        method:"POST",

        headers:{
            "Content-Type":"application/json"
        },

        body:JSON.stringify(login_details)

    })

    .then(res=>res.json())

    .then((data)=>{

        /* USER LOGIN */
        if(data.success && data.user.role === "user"){

            localStorage.setItem(
                "user",
                JSON.stringify(data.user)
            )

            window.location.href = "./reports.html"
        }

        /* ADMIN LOGIN */
        else if(data.success && data.user.role === "admin"){

            localStorage.setItem(
                "user",
                JSON.stringify(data.user)
            )

            window.location.href = "./adminPage.html"
        }

        /* INVALID */
        else{

            msg.innerText = "❌ Invalid username or password"
            msg.style.color = "red"

            btn.innerText = "Login"
            btn.disabled = false
        }
    })

    .catch(()=>{

        msg.innerText = "⚠️ Server error"
        msg.style.color = "orange"

        btn.innerText = "Login"
        btn.disabled = false
    })
}

</script>

</body>
</html>
