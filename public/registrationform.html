<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
// This is the registration form for both Admin and User. The role is being set in the local storage based on the selection of the user in the userRole.html page. Based on that role the user will be registered as admin or user.
<body>
    <form>
        <input placeholder="Create a userName" type="text" name="username" id="un"> </br> </br>
        <input placeholder="Set your password" type="password" name="password" id="ps"> </br> </br>
        <input placeholder="Enter your email" type="email" name="email" id="em"> </br> </br>
        <input placeholder="Enter Your Phone Number" type="text" name="phoneno" id="pn"> </br> </br>
        <button onclick="adduser(event)">Create my account</button>
        <input type="hidden" name="role" id="role">
    </form>
    <script>
        document.getElementById("role").value=localStorage.getItem("role")
        // console.log(localStorage.getItem("role"));
        function adduser(ev){
            ev.preventDefault()
            const data={
                username:document.getElementById("un").value,
                password:document.getElementById("ps").value,
                email:document.getElementById("em").value,
                phoneno:document.getElementById("pn").value,
                role:document.getElementById("role").value
            }
            fetch("http://localhost:3000/register",{
                method:"POST",
                headers:{"Content-Type":"application/json"},
                body:JSON.stringify(data)
            }).then((res)=>res.json())
            .then((data)=>{
                if(data.success){
                    alert("User Registered Successfully")
                    window.location.href="./loginform.html"
                }
                else{
                    alert("User Registration Failed")
                }
        })
    }
    </script>
</body>
</html>
