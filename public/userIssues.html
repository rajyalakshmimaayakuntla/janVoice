<script>
const msg = document.getElementById("msg")
const outer_cont = document.getElementById("outer_cont")
const cont2 = document.getElementById("cont2")

const user = JSON.parse(localStorage.getItem("user"))

/* 🔐 Safety check */
if(!user){
    alert("Please login first")
    window.location.href = "loginform.html"
}

/* Greeting */
msg.innerText = "Hi, " + user.username

/* Loading state */
outer_cont.innerHTML = "<h3 style='text-align:center'>Loading...</h3>"

/* Fetch user issues */
fetch(`/getmyIssues/${user._id}`)
.then(res=>res.json())
.then(data=>genUI(data))

function genUI(data){
    outer_cont.innerHTML = ""
    cont2.innerHTML = ""

    /* Empty state */
    if(data.length === 0){
        outer_cont.innerHTML = "<h3 style='text-align:center'>No Issues Found</h3>"
        return
    }

    data.forEach(issue=>{
        const card = document.createElement("div")
        card.className = "card"

        card.innerHTML = `
            <h3>${issue.issue_name}</h3>
            <img src="/uploads/${issue.issue_image}">
            <p class="status ${issue.issue_status}">
                ${issue.issue_status}
            </p>
        `

        const btn = document.createElement("button")
        btn.innerText = "Explore"

        btn.onclick = ()=>{
            showExpanded(issue)
        }

        card.appendChild(btn)
        outer_cont.appendChild(card)
    })
}

function showExpanded(issue){
    cont2.innerHTML = ""

    const box = document.createElement("div")
    box.className = "expanded"

    box.innerHTML = `
        <h2>${issue.issue_name}</h2>
        <img src="/uploads/${issue.issue_image}" style="width:100%">
        <p><b>Status:</b> ${issue.issue_status}</p>
        <p><b>Address:</b> ${issue.issue_address}</p>

        <h3>User Info</h3>
        <p>${user.username}</p>
        <p>${user.email}</p>
        <p>${user.phoneno}</p>
    `

    const del = document.createElement("button")
    del.innerText = "Delete"
    del.className = "delete"

    del.onclick = ()=>{
        fetch("/deleteIssue",{
            method:"POST",
            headers:{"Content-Type":"application/json"},
            body:JSON.stringify({issueId:issue._id})
        })
        .then(()=> location.reload())
    }

    box.appendChild(del)
    cont2.appendChild(box)

    /* Smooth scroll */
    box.scrollIntoView({behavior:"smooth"})
}

/* Filter */
document.querySelectorAll('input[name="filter"]').forEach(radio=>{
    radio.onchange = ()=>{
        const val = document.querySelector('input[name="filter"]:checked').value

        fetch("/getmyIssuesByStatus",{
            method:"POST",
            headers:{"Content-Type":"application/json"},
            body:JSON.stringify({
                issue_status:val,
                userId:user._id
            })
        })
        .then(res=>res.json())
        .then(data=>genUI(data))
    }
})
</script>
