<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Issues</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: "Poppins", sans-serif;
}

body {
    background: linear-gradient(135deg,#6366f1, #3b82f6);
    min-height: 100vh;
}

/* Navbar */
.navbar {
    display: flex;
    justify-content: space-between;
    padding: 15px 25px;
    background: rgba(255,255,255,0.9);
}

/* Filters */
.filters {
    text-align: center;
    margin: 15px;
}

.filters input {
    margin: 0 5px;
}

/* Grid */
#outer_cont {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
    gap: 20px;
    padding: 20px;
}

/* Card */
.card {
    background: white;
    border-radius: 12px;
    padding: 15px;
    text-align: center;
    box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    transition: 0.3s;
}

.card:hover {
    transform: scale(1.05);
}

.card img {
    width: 100%;
    height: 150px;
    object-fit: cover;
    border-radius: 10px;
}

/* Status */
.status {
    font-weight: bold;
    margin: 10px 0;
}

.Pending { color: orange; }
.Assigned { color: blue; }
.Resolved { color: green; }

/* Button */
button {
    padding: 8px 12px;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    background: #6366f1;
    color: white;
}

.delete {
    background: red;
}

/* Expanded */
.expanded {
    background: white;
    padding: 20px;
    border-radius: 12px;
    width: 60%;
    margin: 20px auto;
    box-shadow: 0 10px 30px rgba(0,0,0,0.3);
}
</style>
</head>

<body>

<div class="navbar">
    <h3>JanVoice</h3>
    <h4 id="msg"></h4>
</div>

<div class="filters">
    <input type="radio" name="filter" value="all" checked>All
    <input type="radio" name="filter" value="Pending">Pending
    <input type="radio" name="filter" value="Assigned">Assigned
    <input type="radio" name="filter" value="Resolved">Resolved
</div>

<div id="outer_cont"></div>
<div id="cont2"></div>

<script>
const user = JSON.parse(localStorage.getItem("user"))
msg.innerText = "Hi, " + user.username

fetch(`http://localhost:3000/getmyIssues/${user._id}`)
.then(res=>res.json())
.then(data=>genUI(data))

function genUI(data){
    outer_cont.innerHTML = ""
    cont2.innerHTML = ""

    data.forEach(issue=>{
        const card = document.createElement("div")
        card.className = "card"

        card.innerHTML = `
            <h3>${issue.issue_name}</h3>
            <img src="/${issue.issue_image}">
            <p class="status ${issue.issue_status}">
                ${issue.issue_status}
            </p>
        `

        const btn = document.createElement("button")
        btn.innerText = "Explore"

        btn.onclick = ()=>{
            showExpanded(issue)
        }

        card.appendChild(btn)
        outer_cont.appendChild(card)
    })
}

function showExpanded(issue){
    cont2.innerHTML = ""

    const box = document.createElement("div")
    box.className = "expanded"

    box.innerHTML = `
        <h2>${issue.issue_name}</h2>
        <img src="/${issue.issue_image}" style="width:100%">
        <p><b>Status:</b> ${issue.issue_status}</p>
        <p><b>Address:</b> ${issue.issue_address}</p>

        <h3>User Info</h3>
        <p>${user.username}</p>
        <p>${user.email}</p>
        <p>${user.phoneno}</p>
    `

    const del = document.createElement("button")
    del.innerText = "Delete"
    del.className = "delete"

    del.onclick = ()=>{
        fetch("/deleteIssue",{
            method:"POST",
            headers:{"Content-Type":"application/json"},
            body:JSON.stringify({issueId:issue._id})
        })
        .then(res=>res.json())
        .then(()=>{
            location.reload()
        })
    }

    box.appendChild(del)
    cont2.appendChild(box)
}

/* Filter */
document.querySelectorAll('input[name="filter"]').forEach(radio=>{
    radio.onchange = ()=>{
        const val = document.querySelector('input[name="filter"]:checked').value

        fetch("/getmyIssuesByStatus",{
            method:"POST",
            headers:{"Content-Type":"application/json"},
            body:JSON.stringify({issue_status:val,userId:user._id})
        })
        .then(res=>res.json())
        .then(data=>genUI(data))
    }
})
</script>

</body>
</html>
